# Base stack: nginx (TLS termination) + frontend + backend + MongoDB on a
# single host. Environment specifics (restart/logging policy) live in
# docker-compose.preprod.yml / docker-compose.prod.yml. Non-secret config
# comes from deploy/env/<env>.env; real secrets come from .secrets/<env>.env,
# exported into the remote shell's environment at `up` time rather than
# written to disk on the deployment host — see deploy/deploy.sh. Because of
# that, secret-only vars below must NOT use a
# hard-required (${VAR:?...}) default: that would make every `docker compose`
# subcommand (ps, logs, exec, ...) demand the secrets file too, not just `up`.
#
# The TLS certificate + private key are files, not env vars, so they can't go
# through that same env-var channel — nginx needs them on disk. deploy.sh
# copies them from .secrets/certs/<environment>/ on the deploying machine to
# .secrets/certs/ under the remote deploy path (mode 600), which is what the
# nginx service below mounts.
#
# Values here mirror backend/.env.example and frontend/.env.local.example.
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-apartment103}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-apartment103-backend}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-apartment103}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-[]}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-30}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_ADDRESS: ${SENDGRID_FROM_ADDRESS:-no-reply@bergseehome.ch}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      COMMISSION_RATE: ${COMMISSION_RATE:-0.05}
      IMAGE_STORAGE_PATH: /data/images
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - image_data:/data/images

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in the deploy env file}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:?FRONTEND_DOMAIN must be set in the deploy env file}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set in the deploy env file}
      SSL_CERT_FILE: ${SSL_CERT_FILE:?SSL_CERT_FILE must be set in the deploy env file}
      SSL_KEY_FILE: ${SSL_KEY_FILE:?SSL_KEY_FILE must be set in the deploy env file}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ../.secrets/certs:/etc/nginx/certs:ro
      - image_data:/data/images:ro

volumes:
  mongo_data:
  image_data:
