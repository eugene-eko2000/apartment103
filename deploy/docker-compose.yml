# Base stack: nginx (frontend/API split) + frontend + backend + MongoDB, one
# Compose project per environment. Environment specifics (restart/logging
# policy) live in docker-compose.preprod.yml / docker-compose.prod.yml.
# Non-secret config comes from deploy/env/<env>.env; real secrets come from
# .secrets/<env>.env, exported into the remote shell's environment at `up`
# time rather than written to disk on the deployment host — see
# deploy/deploy.sh. Because of that, secret-only vars below must NOT use a
# hard-required (${VAR:?...}) default: that would make every `docker compose`
# subcommand (ps, logs, exec, ...) demand the secrets file too, not just `up`.
#
# This stack no longer terminates TLS and no longer binds :80/:443 — preprod
# and prod share one host, and only one process can own those ports. The
# shared edge proxy (deploy/edge/, Compose project apartment103-edge) owns
# them, terminates TLS for all four hostnames and forwards to this stack's
# nginx over the apartment103-<env>-edge network. See
# docs/single-host-deployment-proposal.md.
#
# Values here mirror backend/.env.example and frontend/.env.local.example.
services:
  mongo:
    image: mongo:7
    # Two mongods share this host. mongod defaults its WiredTiger cache to
    # max(0.5 x (RAM - 1GB), 256MB) with no idea another instance is doing
    # the same, so both would try to claim the whole machine — cap each one
    # explicitly instead.
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.5}"]
    mem_limit: ${MONGO_MEM_LIMIT:-1g}
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-apartment103}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-apartment103-backend}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-apartment103}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-[]}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-30}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_ADDRESS: ${SENDGRID_FROM_ADDRESS:-no-reply@bergseehome.ch}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      COMMISSION_RATE: ${COMMISSION_RATE:-0.06}
      PENDING_BOOKING_TTL_MINUTES: ${PENDING_BOOKING_TTL_MINUTES:-15}
      PENDING_BOOKING_SWEEP_INTERVAL_MINUTES: ${PENDING_BOOKING_SWEEP_INTERVAL_MINUTES:-1}
      GUEST_DATA_RETENTION_DAYS: ${GUEST_DATA_RETENTION_DAYS:-30}
      GUEST_DATA_RETENTION_SWEEP_HOUR: ${GUEST_DATA_RETENTION_SWEEP_HOUR:-4}
      GUEST_DATA_RETENTION_SWEEP_MINUTE: ${GUEST_DATA_RETENTION_SWEEP_MINUTE:-30}
      IMAGE_STORAGE_PATH: /data/images
    volumes:
      - image_data:/data/images

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in the deploy env file}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:?FRONTEND_DOMAIN must be set in the deploy env file}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set in the deploy env file}
    # Loopback only, and a different port per environment. This is the
    # debugging handle: curl it and you have exercised the whole stack without
    # involving the edge proxy or DNS.
    ports:
      - "127.0.0.1:${DEBUG_PORT:?DEBUG_PORT must be set in the deploy env file}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - image_data:/data/images:ro
    networks:
      default: {}
      edge:
        aliases:
          # Unique per environment: the edge proxy is attached to BOTH
          # environments' networks, so the bare service name "nginx" resolves
          # ambiguously from there.
          - ${ENV_SLUG:?ENV_SLUG must be set in the deploy env file}-edge

networks:
  default: {}
  # Created out-of-band by deploy.sh (docker network create), not by this
  # project, so `docker compose down` here cannot delete a network the edge
  # proxy is still attached to, and the three projects can start in any order.
  edge:
    external: true
    name: apartment103-${ENV_SLUG}-edge

volumes:
  mongo_data:
  image_data:
